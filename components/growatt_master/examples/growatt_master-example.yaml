growatt_master:
  id: master
  modbus_id: modbus_growatt
  max_inverters: 4

  inverters:
    - id: inv1
      update_interval: 2s        # fast cycle: control relevant registers
      slow_update_interval: 30s  # counters, temperatures, diagnostics
      # address / phases / strings / ups / battery omitted => AUTODETECT
      info:
        name: "Inverter 1 Info"
        icon: mdi:solar-power-variant

      # --- nameplate, read once during identification ---
      firmware: {name: "Firmware"}
      serial_number: {name: "Serial Number"}
      manufacturer: {name: "Manufacturer"}
      model: {name: "Model"}
      bootloader: {name: "Boot Loader"}
      normal_power: {name: "Normal Power"}
      modbus_version: {name: "Modbus Version"}

      # --- always polled (input 0..56 and 101..105) ---
      status_code: {name: "Status Code"}
      pv_active_power: {name: "PV Power"}
      grid_active_power: {name: "Grid Power"}
      frequency: {name: "Frequency"}
      energy_today: {name: "Energy Today"}
      energy_total: {name: "Energy Total"}
      real_power_percent: {name: "Real Power Percent"}
      output_max_power: {name: "Output Max Power"}
      fault_code: {name: "Fault Code"}

      phase_a:
        voltage: {name: "L1 Voltage"}
        current: {name: "L1 Current"}
        active_power: {name: "L1 Power"}
      phase_b:
        voltage: {name: "L2 Voltage"}
        current: {name: "L2 Current"}
        active_power: {name: "L2 Power"}
      phase_c:
        voltage: {name: "L3 Voltage"}
        current: {name: "L3 Current"}
        active_power: {name: "L3 Power"}

      # three phase models only
      line_voltage_ab: {name: "L1-L2 Voltage"}
      line_voltage_bc: {name: "L2-L3 Voltage"}
      line_voltage_ca: {name: "L3-L1 Voltage"}

      pv1:
        voltage: {name: "PV1 Voltage"}
        current: {name: "PV1 Current"}
        active_power: {name: "PV1 Power"}
      pv2:
        voltage: {name: "PV2 Voltage"}
        current: {name: "PV2 Current"}
        active_power: {name: "PV2 Power"}

      # --- storage only (input 1000..1096), skipped on grid-tie models ---
      battery_voltage: {name: "Battery Voltage"}
      battery_soc: {name: "Battery SOC"}
      battery_charge_power: {name: "Battery Charge Power"}
      battery_discharge_power: {name: "Battery Discharge Power"}
      battery_capacity: {name: "Battery Capacity"}
      battery_cycles: {name: "Battery Cycles"}
      battery_health: {name: "Battery Health"}
      charge_energy_today: {name: "Charge Energy Today"}
      charge_energy_total: {name: "Charge Energy Total"}
      discharge_energy_today: {name: "Discharge Energy Today"}
      discharge_energy_total: {name: "Discharge Energy Total"}
      ups_load: {name: "UPS Load"}
      ups_frequency: {name: "UPS Frequency"}
      ups_phase_a:
        voltage: {name: "UPS L1 Voltage"}
        current: {name: "UPS L1 Current"}
        active_power: {name: "UPS L1 Power"}
      ups_phase_b:
        voltage: {name: "UPS L2 Voltage"}
        current: {name: "UPS L2 Current"}
        active_power: {name: "UPS L2 Power"}
      ups_phase_c:
        voltage: {name: "UPS L3 Voltage"}
        current: {name: "UPS L3 Current"}
        active_power: {name: "UPS L3 Power"}

      # ================= control surface =================
      refresh: {name: "Refresh"}
      dump_registers: {name: "Dump Registers"}

      # written immediately, one register each (function 0x06)
      active_power_rate: {name: "Active Power Rate"}
      grid_first_discharge_rate: {name: "Grid First Discharge Rate"}
      grid_first_stop_soc: {name: "Grid First Stop SOC"}
      battery_first_charge_rate: {name: "Battery First Charge Rate"}
      battery_first_stop_soc: {name: "Battery First Stop SOC"}
      ac_charge: {name: "AC Charge"}

      # Time windows. Edits are staged; nothing reaches the inverter until
      # Apply is pressed, which sends all 9 registers in one 0x10 command.
      # Windows may wrap past midnight, e.g. 23:00-06:59.
      grid_first:
        apply: {name: "Grid First Apply"}
        period1:
          start_hour: {name: "Grid First P1 Start Hour"}
          start_minute: {name: "Grid First P1 Start Minute"}
          stop_hour: {name: "Grid First P1 Stop Hour"}
          stop_minute: {name: "Grid First P1 Stop Minute"}
          enabled: {name: "Grid First P1 Enabled"}
        period2:
          start_hour: {name: "Grid First P2 Start Hour"}
          start_minute: {name: "Grid First P2 Start Minute"}
          stop_hour: {name: "Grid First P2 Stop Hour"}
          stop_minute: {name: "Grid First P2 Stop Minute"}
          enabled: {name: "Grid First P2 Enabled"}
        period3:
          start_hour: {name: "Grid First P3 Start Hour"}
          start_minute: {name: "Grid First P3 Start Minute"}
          stop_hour: {name: "Grid First P3 Stop Hour"}
          stop_minute: {name: "Grid First P3 Stop Minute"}
          enabled: {name: "Grid First P3 Enabled"}

      battery_first:
        apply: {name: "Battery First Apply"}
        period1:
          start_hour: {name: "Battery First P1 Start Hour"}
          start_minute: {name: "Battery First P1 Start Minute"}
          stop_hour: {name: "Battery First P1 Stop Hour"}
          stop_minute: {name: "Battery First P1 Stop Minute"}
          enabled: {name: "Battery First P1 Enabled"}
        period2:
          start_hour: {name: "Battery First P2 Start Hour"}
          start_minute: {name: "Battery First P2 Start Minute"}
          stop_hour: {name: "Battery First P2 Stop Hour"}
          stop_minute: {name: "Battery First P2 Stop Minute"}
          enabled: {name: "Battery First P2 Enabled"}
        period3:
          start_hour: {name: "Battery First P3 Start Hour"}
          start_minute: {name: "Battery First P3 Start Minute"}
          stop_hour: {name: "Battery First P3 Stop Hour"}
          stop_minute: {name: "Battery First P3 Stop Minute"}
          enabled: {name: "Battery First P3 Enabled"}

  # ---------------- smart meters on the same bus ----------------
  # All Eastron meters share the register map, so the model select is an
  # override: "Auto" lets the component count live phase voltages instead.
  meters:
    - id: grid_meter
      address: 2
      update_interval: 2s
      slow_update_interval: 30s
      model_select: {name: "Grid Meter Model"}
      info: {name: "Grid Meter Info"}

      phase_a:
        voltage: {name: "Grid L1 Voltage"}
        current: {name: "Grid L1 Current"}
        active_power: {name: "Grid L1 Power"}
        power_factor: {name: "Grid L1 Power Factor"}
      phase_b:
        voltage: {name: "Grid L2 Voltage"}
        current: {name: "Grid L2 Current"}
        active_power: {name: "Grid L2 Power"}
        power_factor: {name: "Grid L2 Power Factor"}
      phase_c:
        voltage: {name: "Grid L3 Voltage"}
        current: {name: "Grid L3 Current"}
        active_power: {name: "Grid L3 Power"}
        power_factor: {name: "Grid L3 Power Factor"}

      total_active_power: {name: "Grid Total Power"}
      frequency: {name: "Grid Frequency"}
      import_active_energy: {name: "Grid Import Energy"}
      export_active_energy: {name: "Grid Export Energy"}


# ---------------- control surface (web + Home Assistant) ----------------
# The component owns and persists address / phases / strings. These entities
# are just views on it: read through lambda, write through set_action.
# No optimistic / restore_value here, otherwise they would keep a second copy
# of the state and drift apart from the component after a reboot.

number:
  - platform: template
    id: inv1_address
    name: "Inverter 1 Address"
    icon: mdi:identifier
    min_value: 0            # 0 = slot disabled
    max_value: 247
    step: 1
    mode: box
    update_interval: 60s
    lambda: |-
      return id(inv1)->get_address();
    set_action:
      - lambda: id(inv1)->change_address((uint8_t) x);

select:
  - platform: template
    id: inv1_phases
    name: "Inverter 1 Phases"
    icon: mdi:sine-wave
    options:
      - "Auto"
      - "Single phase"
      - "Three phase"
    update_interval: 60s
    lambda: |-
      switch (id(inv1)->get_cfg_phases()) {
        case 1:  return std::string("Single phase");
        case 3:  return std::string("Three phase");
        default: break;
      }
      return std::string("Auto");
    set_action:
      - lambda: |-
          int8_t v = 0;                       // Auto
          if (x == "Single phase") v = 1;
          else if (x == "Three phase") v = 3;
          id(inv1)->set_cfg_phases(v);
          id(inv1)->restart_identification();

  - platform: template
    id: inv1_strings
    name: "Inverter 1 PV Strings"
    icon: mdi:solar-panel
    options: ["Auto", "1", "2", "3", "4", "5", "6", "7", "8"]
    update_interval: 60s
    lambda: |-
      int8_t v = id(inv1)->get_cfg_strings();
      if (v <= 0) return std::string("Auto");
      return std::string(to_string((int) v));
    set_action:
      - lambda: |-
          int8_t v = (x == "Auto") ? 0 : (int8_t) atoi(x.c_str());
          id(inv1)->set_cfg_strings(v);
          id(inv1)->restart_identification();

