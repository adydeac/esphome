# =============================================================================
# growatt_master - every option the component accepts.
#
# Nearly nothing here is required. The point is to show what exists; a real
# configuration declares the handful of entities it wants, since each costs RAM
# on the ESP and a row in Home Assistant.
#
# Two things changed shape and are worth reading before copying:
#
#   'address' is an entity, not a value, and it is required. It lives in flash,
#   so YAML has no say after the first boot. A device left at 0 is an empty slot
#   and is never put on the bus.
#
#   Most tuning moved out of YAML into entities. The keys that remain are the
#   starting point only; whatever is set at runtime wins after that.
#
# Note the shape: at hub level every setting is a key of growatt_master itself,
# and on inverters and meters every sensor is a key of that device. There are no
# 'sensors:' or 'settings:' groupings.
# =============================================================================

uart:
  - id: uart_inverters
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
  - id: uart_meters
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 9600

modbus:
  - id: bus_inverters
    uart_id: uart_inverters
    send_wait_time: 500ms
    turnaround_time: 100ms
  - id: bus_meters
    uart_id: uart_meters
    send_wait_time: 500ms
    turnaround_time: 100ms

external_components:
  - source:
      type: local
      path: components

growatt_master:
  id: growatt_hub

  # One bus for everything, or one per family. 'modbus_id' alone keeps the
  # single bus behaviour; naming either specific one splits them, and whichever
  # is missing falls back to 'modbus_id'.
  inverters_modbus_id: bus_inverters
  meters_modbus_id: bus_meters
  # modbus_id: bus_inverters

  # Slots are allocated at compile time, so this must cover every inverter that
  # might ever be declared, not just those present today.
  max_inverters: 5

  meter_offline_hold: 5min
  grid_power_sensor_id: mains_contactor

  # A single phase inverter on the phase with the least headroom holds back
  # every three phase unit. Trading some of its output unlocks three times as
  # much elsewhere.
  phase_rebalancing: true
  rebalance_threshold: 300

  # --- settings, persisted in flash --------------------------------------
  grid_phase_voltage_low:
    name: "Hub Grid Phase Voltage Low"
  grid_phase_voltage_high:
    name: "Hub Grid Phase Voltage High"
  grid_line_voltage_low:
